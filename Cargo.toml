[package]
name = "file-origin-tracker"
version = "0.1.10"
edition = "2021"
authors = ["FileOriginTracker"]
description = "后台追踪文件/文件夹来自哪个程序创建的 Windows 系统工具"

# lib 同时生成 rlib（给主程序链接）和 cdylib（右键菜单扩展 DLL）
[lib]
name = "file_origin_tracker_shell"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "file-origin-tracker"
path = "src/main.rs"

# 优化编译大小和运行性能
[profile.release]
opt-level = 3           # 最高优化级别
lto = "fat"             # 全链接时优化，减小体积
codegen-units = 1       # 单编译单元，更优化
panic = "abort"         # 减小 panic 处理代码
strip = true            # 去除调试符号，减小体积

[dependencies]
# Windows API 绑定
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_LibraryLoader",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Controls",
    # 文件选择对话框（添加程序到黑白名单）
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_SystemServices",
    # 复制词条到剪贴板需要数据交换（剪贴板）与全局内存分配
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    # 允许用 #[implement] 实现 COM 接口（右键菜单扩展）
    "implement",
] }
# #[implement] 宏展开后会引用 windows_core，因此需要显式依赖
windows-core = "0.58"

# 序列化配置文件
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite 本地数据库（bundled 模式）
rusqlite = { version = "0.31", features = ["bundled"] }

# 错误处理
anyhow = "1"

# 日志（使用自定义文件日志器，见 main.rs 的 FileLogger）
# alloc feature 用于启用 set_boxed_logger
log = { version = "0.4", features = ["alloc"] }

# 获取用户目录（如 AppData）
directories = "5"

# 字符串处理
once_cell = "1"
